
name: Build FARDIN FX-991F APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o calcclone.zip -d .
          test -f package.json
          mkdir -p assets
          cp file_000000002db0821180def70529f16d18.png assets/icon.png

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @capacitor/assets --legacy-peer-deps
          npm run build

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          npx capacitor-assets generate --android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FARDIN-FX-991F-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
